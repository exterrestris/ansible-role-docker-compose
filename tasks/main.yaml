- name: generate docker compose files
  include_tasks: compose-project.yaml
  vars:
    _docker_compose_compose_file: "{{ project.compose_file | default(docker_compose_compose_file) }}"
    _docker_compose_project_dir: "{{ project.project_dir }}"
    _docker_compose_project_label: "{{ project.project_label | default(project.project_dir) ~ ' project' }}"
    _docker_compose_project_owner: "{{ project.project_owner | default(docker_compose_project_owner) }}"
    _docker_compose_project_group: "{{ project.project_group | default(docker_compose_project_group) }}"
    _docker_compose_project_mode: "{{ project.project_mode | default(docker_compose_project_mode) }}"
    _docker_compose_project_dir_mode: "{{ project.project_dir_mode | default(docker_compose_project_dir_mode) }}"
    _docker_compose_project_bind_file_owner: "{{ project.default_file_owner | default(docker_compose_project_bind_file_owner) }}"
    _docker_compose_project_bind_file_group: "{{ project.default_file_group | default(docker_compose_project_bind_file_group) }}"
    _docker_compose_project_bind_file_mode: "{{ project.default_file_mode | default(docker_compose_project_bind_file_mode) }}"
    _docker_compose_project_env_file_owner: "{{ project.env_file_owner | default(docker_compose_project_env_file_owner) }}"
    _docker_compose_project_env_file_group: "{{ project.env_file_group | default(docker_compose_project_env_file_group) }}"
    _docker_compose_project_env_file_mode: "{{ project.env_file_mode | default(docker_compose_project_env_file_mode) }}"
    _docker_compose_containers: "{{ project.containers }}"
    _docker_compose_networks: "{{ project.networks | default(docker_compose_networks) }}"
    _docker_compose_volumes: "{{ project.volumes | default(docker_compose_volumes) }}"
    _docker_compose_autostart: "{{ project.autostart | default(docker_compose_autostart) }}"
    _docker_compose_pull_images: "{{ project.pull_images | default(docker_compose_pull_images) }}"
    _docker_compose_process_bind_mounts: "{{ project.process_bind_mounts | default(docker_compose_process_bind_mounts) }}"
    _docker_compose_create_bind_mounts: "{{ project.create_mounts | default(docker_compose_create_bind_mounts) }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.project_dir }}"
  when: docker_compose_projects | length > 0
