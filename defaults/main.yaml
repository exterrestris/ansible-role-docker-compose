---
docker_compose_containers: []

docker_compose_networks: []

docker_compose_volumes: []

docker_compose_autostart: yes

docker_compose_pull_images: yes

docker_compose_create_mounts: yes

docker_compose_projects: []

docker_compose_compose_file: compose.yaml

docker_compose_project_owner: root

docker_compose_project_group: docker

docker_compose_project_mode: '640'

docker_compose_project_dir_mode: '750'

docker_compose_project_bind_file_owner: "{{ docker_compose_project_owner }}"

docker_compose_project_bind_file_group: "{{ docker_compose_project_group }}"

docker_compose_project_bind_file_mode: "{{ docker_compose_project_mode }}"

docker_compose_project_env_file_owner: "{{ docker_compose_project_owner }}"

docker_compose_project_env_file_group: "{{ docker_compose_project_group }}"

docker_compose_project_env_file_mode: "{{ docker_compose_project_mode }}"
