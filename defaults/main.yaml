---
compose_projects: []

compose_default_networks: []

compose_default_volumes: []

compose_autostart: yes

compose_pull_images: yes

compose_process_bind_mounts: yes

compose_create_bind_mounts: yes

compose_file: compose.yaml

compose_owner: root

compose_group: docker

compose_file_mode: '640'

compose_dir_mode: '750'

compose_bind_file_owner: "{{ compose_owner }}"

compose_bind_file_group: "{{ compose_group }}"

compose_bind_file_mode: "{{ compose_file_mode }}"

compose_env_file_owner: "{{ compose_owner }}"

compose_env_file_group: "{{ compose_group }}"

compose_env_file_mode: "{{ compose_file_mode }}"

compose_remove_other_compose_files: yes

compose_remove_compose_files:
  - compose.yaml
  - compose.yml
  - docker-compose.yaml
  - docker-compose.yml
